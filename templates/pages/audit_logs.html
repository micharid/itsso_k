{% load static %}
<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>감사 로그 - ChannelP</title>
<link rel="stylesheet" href="/assets/css/common.css"><link rel="stylesheet" href="/assets/css/layout.css"><link rel="stylesheet" href="/assets/css/components.css"></head>
<body><div class="app-wrapper"><header class="app-header"><div class="header-left"><button class="sidebar-toggle-btn" id="sidebarToggle"><span></span><span></span><span></span></button><span class="header-logo">ChannelP</span></div><div class="header-right"><div class="header-user"><span id="headerUsername">-</span><button class="btn btn-sm btn-ghost" id="logoutBtn">로그아웃</button></div></div></header><nav class="app-sidebar" id="appSidebar"></nav><main class="app-main"><div class="page-header"><h1 class="page-title">감사 로그</h1></div><div class="card"><div class="card-body"><button class="btn btn-primary" id="reloadBtn">조회</button><pre id="out" style="margin-top:12px;">대기 중...</pre></div></div></main></div>
<script src="/assets/js/sidebar.js"></script><script src="/assets/js/common.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script>async function load(){const data=await API.auditLogs.list({page:1,page_size:50}).catch(e=>({error:e.message}));document.getElementById('out').textContent=JSON.stringify(data,null,2);}async function boot(){if(!getAccessToken()&&typeof refreshTokens==='function'){await refreshTokens();}if(!getAccessToken()){location.href='/login.html';return;}const me=await API.auth.me().catch(()=>null);if(!me){location.href='/login.html';return;}document.getElementById('headerUsername').textContent=me.username||'-';document.getElementById('logoutBtn').onclick=logout;document.getElementById('reloadBtn').onclick=load;await load();}boot();</script>
</body></html>
