{% load static %}
﻿<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키워드 분석 — ChannelP</title>
<link rel="stylesheet" href="/assets/css/common.css?v=20260410">
<link rel="stylesheet" href="/assets/css/layout.css?v=20260410">
<link rel="stylesheet" href="/assets/css/components.css?v=20260410">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.kw-tabs { display:flex; gap:0; border-bottom:1px solid var(--border-default); margin-bottom:16px; }
.kw-tab  { padding:9px 20px; cursor:pointer; font-size:14px; font-weight:500; color:var(--text-secondary);
           border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .15s; }
.kw-tab.active { color:var(--accent-primary); border-bottom-color:var(--accent-primary); }
.kw-tab-panel  { display:none; }
.kw-tab-panel.active { display:block; }

/* 날짜 네비 */
.date-nav { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.date-nav-btn { width:28px; height:28px; border-radius:50%; border:1px solid var(--border-default);
                background:var(--bg-elevated); color:var(--text-secondary); cursor:pointer; font-size:16px;
                display:flex;align-items:center;justify-content:center; }
.date-nav-btn:hover { background:var(--accent-primary); color:#fff; }

/* 키워드 랭킹 */
.kw-rank-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:900px){ .kw-rank-grid{grid-template-columns:1fr;} }

.kw-rank-item {
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:6px;
  cursor:pointer; transition:background .12s;
}
.kw-rank-item:hover { background:var(--bg-elevated); }
.kw-rank-num {
  font-size:11px; font-weight:700; min-width:28px; text-align:center;
  color:var(--text-muted);
}
.kw-rank-num.top3 { font-size:16px; }
.kw-rank-trend { font-size:10px; min-width:44px; text-align:center; }
.kw-rank-name  { flex:1; font-size:14px; font-weight:600; }
.kw-rank-bar-wrap { width:120px; background:var(--bg-elevated); border-radius:3px; height:6px; overflow:hidden; }
.kw-rank-bar      { height:6px; border-radius:3px; background:var(--accent-primary); }
.trend-up   { color:#4caf50; }
.trend-down { color:#f44336; }
.trend-new  { color:#ff9800; font-weight:700; }
.trend-same { color:var(--text-muted); }

/* 인기상품 테이블 */
.product-thumb { width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--border-default);background:var(--bg-elevated); }
</style>
</head>
<body>
<div class="app-wrapper">
  <header class="app-header">
    <div class="header-left">
      <button class="sidebar-toggle-btn" id="sidebarToggle"><span></span><span></span><span></span></button>
      <span class="header-logo">ChannelP</span>
    </div>
    <div class="header-right">
      <div class="header-user">
        <span id="headerUsername">—</span>
        <button class="btn btn-sm btn-ghost" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </header>
  <nav class="app-sidebar" id="appSidebar"></nav>

  <main class="app-main">
    <div class="page-header">
      <div>
        <div class="breadcrumb"><span>홈</span> / <span>키워드 분석</span></div>
        <h1 class="page-title">키워드 분석</h1>
      </div>
    </div>

    <!-- 탭 -->
    <div class="kw-tabs">
      <div class="kw-tab active" data-tab="ranking">키워드 분석</div>
      <div class="kw-tab" data-tab="products">인기상품</div>
    </div>

    <!-- ═══ 키워드 분석 탭 ═══ -->
    <div class="kw-tab-panel active" id="panel-ranking">
      <div class="card" style="padding:14px;margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <!-- 날짜 네비 -->
          <div class="date-nav">
            <button class="date-nav-btn" id="prevDateBtn">‹</button>
            <span id="currentDateLabel" style="font-size:14px;font-weight:600;min-width:90px;text-align:center">—</span>
            <button class="date-nav-btn" id="nextDateBtn">›</button>
            <span id="dateSubLabel" style="font-size:12px;color:var(--text-muted)"></span>
          </div>
          <!-- 필터 -->
          <div style="display:flex;gap:8px;align-items:center">
            <select id="periodSelect" class="form-select" style="width:120px">
              <option value="daily" selected>일간</option>
              <option value="weekly">주간</option>
              <option value="monthly">월간</option>
            </select>
            <select id="topNSelect" class="form-select" style="width:90px">
              <option value="10">TOP 10</option>
              <option value="20" selected>TOP 20</option>
              <option value="50">TOP 50</option>
            </select>
            <button class="btn btn-sm btn-ghost" id="refreshBtn">새로고침</button>
          </div>
        </div>
        <div style="margin-top:8px;font-size:12px;color:var(--text-muted)">
          총 <strong id="totalKeywords">—</strong>개 키워드 · <strong id="totalProducts">—</strong>개 상품 수집
          <span id="collectStatus" style="margin-left:8px"></span>
        </div>
      </div>

      <!-- 차트 + 랭킹 -->
      <div style="display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start">
        <!-- 도넛 차트 -->
        <div class="card" style="padding:14px">
          <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;text-align:center">점유율 분포</div>
          <div style="position:relative;width:200px;margin:0 auto 12px">
            <canvas id="pieChart" width="200" height="200"></canvas>
            <div id="pieCenter" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);pointer-events:none">
              <div id="pieCenterNum" style="font-size:24px;font-weight:700;color:var(--text-primary)">—</div>
              <div>키워드</div>
            </div>
          </div>
          <div id="legendArea" style="font-size:11px;line-height:1.9"></div>
        </div>

        <!-- 랭킹 리스트 -->
        <div class="card" style="padding:14px">
          <div id="rankingLoading" style="color:var(--text-muted);font-size:13px;padding:20px;text-align:center">
            <span style="display:inline-block;width:16px;height:16px;border:2px solid var(--accent-primary);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle"></span>
            키워드 데이터를 불러오는 중...
          </div>
          <div id="rankingArea" class="kw-rank-grid" style="display:none"></div>
          <div id="rankingEmpty" style="display:none;padding:32px;text-align:center;color:var(--text-muted);font-size:13px">
            해당 날짜의 키워드 데이터가 없습니다.<br>
            <span style="font-size:12px">네이버 DataLab 수집이 완료된 후 표시됩니다.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══ 인기상품 탭 ═══ -->
    <div class="kw-tab-panel" id="panel-products">
      <div class="card" style="padding:14px;margin-bottom:14px">
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
          <div>
            <label class="form-label">기간</label>
            <select id="prodPeriodSelect" class="form-select" style="width:120px">
              <option value="daily" selected>일간</option>
              <option value="weekly">주간</option>
            </select>
          </div>
          <div>
            <label class="form-label">표시 수</label>
            <select id="prodLimitSelect" class="form-select" style="width:90px">
              <option value="10">10개</option>
              <option value="30" selected>30개</option>
              <option value="50">50개</option>
            </select>
          </div>
          <div>
            <label class="form-label">가격 범위</label>
            <input id="priceMin" class="form-input" type="number" placeholder="최소" style="width:90px">
            <span style="padding:0 4px;color:var(--text-muted)">~</span>
            <input id="priceMax" class="form-input" type="number" placeholder="최대" style="width:90px">
          </div>
          <button class="btn btn-sm btn-ghost" id="prodFilterBtn">전체 키워드</button>
          <button class="btn btn-sm btn-primary" id="prodRefreshBtn">조회</button>
        </div>
      </div>

      <div class="card">
        <div class="table-container">
          <table class="data-table" id="prodTable">
            <thead>
              <tr>
                <th style="width:44px">순위</th>
                <th style="width:56px">이미지</th>
                <th>상품명</th>
                <th style="width:90px">최저가</th>
                <th style="width:90px">쇼핑몰</th>
                <th style="width:80px">브랜드</th>
                <th>카테고리</th>
                <th style="width:60px">카드</th>
                <th style="width:90px">수집일</th>
              </tr>
            </thead>
            <tbody id="prodTbody">
              <tr><td colspan="9" class="text-center text-muted" style="padding:24px">조회 버튼을 눌러주세요.</td></tr>
            </tbody>
          </table>
        </div>
        <div id="prodPagination" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-muted)"></div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <span id="versionLabel">v0.1.0</span>
    <div class="footer-status">
      <span id="footerStatus" style="color:var(--text-muted)">마지막 수집: —</span>
    </div>
    <span id="footerUser">-</span>
  </footer>
</div>

<script src="/assets/js/sidebar.js?v=20260410"></script>
<script src="/assets/js/common.js?v=20260410"></script>
<script src="/assets/js/api.js?v=20260410"></script>
<script src="/assets/js/theme.js?v=20260410"></script>
<script>
// ── HTTP 이미지 프록시 ────────────────────────────────────────────────────
function toProxyUrl(url) {
  if (!url) return '';
  if (url.startsWith('http://')) return '/api/products/proxy-image?url=' + encodeURIComponent(url);
  return url;
}

// ── 상태 ────────────────────────────────────────────────────────────────
let _currentDate  = '';   // YYYY-MM-DD
let _availDates   = [];   // 수집된 날짜 목록
let _lastKeywords = [];
let _pieChart     = null;
let _prodOffset   = 0;
const _prodLimit  = () => parseInt(document.getElementById('prodLimitSelect').value || 30);
let _selectedKw   = null;

const CHART_COLORS = [
  '#4f8ef7','#f7b94f','#4fcaf7','#f74f88','#4ff7a0',
  '#b04ff7','#f7694f','#4ff7d3','#f7f44f','#6e6ef7',
];

// ── 탭 전환 ─────────────────────────────────────────────────────────────
document.querySelectorAll('.kw-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.kw-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.kw-tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    const panel = document.getElementById('panel-' + tab.dataset.tab);
    if (panel) panel.classList.add('active');
    if (tab.dataset.tab === 'products' && !document.getElementById('prodTbody').children.length) loadProducts();
  });
});

// ── 날짜 네비 ────────────────────────────────────────────────────────────
function dateIdx() { return _availDates.indexOf(_currentDate); }

function navigateDate(delta) {
  const idx = dateIdx();
  const newIdx = Math.max(0, Math.min(_availDates.length - 1, idx + delta));
  if (_availDates[newIdx] && _availDates[newIdx] !== _currentDate) {
    _currentDate = _availDates[newIdx];
    renderDateNav();
    loadKeywordRanking();
  }
}

function renderDateNav() {
  const el = document.getElementById('currentDateLabel');
  if (el) el.textContent = _currentDate || '—';
  const idx = dateIdx();
  document.getElementById('prevDateBtn').disabled = idx <= 0;
  document.getElementById('nextDateBtn').disabled = idx >= _availDates.length - 1;
  document.getElementById('dateSubLabel').textContent =
    idx === 0 ? '(최신)' : idx === _availDates.length - 1 ? '(가장 오래된 데이터)' : '';
}

document.getElementById('prevDateBtn').addEventListener('click', () => navigateDate(+1));
document.getElementById('nextDateBtn').addEventListener('click', () => navigateDate(-1));
document.getElementById('refreshBtn').addEventListener('click', loadKeywordRanking);
document.getElementById('periodSelect').addEventListener('change', loadKeywordRanking);
document.getElementById('topNSelect').addEventListener('change', loadKeywordRanking);
document.getElementById('prodRefreshBtn').addEventListener('click', () => { _prodOffset = 0; loadProducts(); });
document.getElementById('prodPeriodSelect').addEventListener('change', () => { _prodOffset = 0; loadProducts(); });

// ── 키워드 수집 날짜 목록 조회 ────────────────────────────────────────────
async function loadAvailDates() {
  try {
    const data = await request('GET', '/products/trending/dates');
    _availDates = (data.dates || []).sort().reverse();
    if (_availDates.length) {
      _currentDate = _availDates[0];
    }
  } catch(e) {
    // 날짜 목록 API 없으면 빈 목록으로 시작, 랭킹 로드 시 최신 날짜 자동 결정
    _availDates = [];
  }
  renderDateNav();
}

// ── 키워드 랭킹 조회 ─────────────────────────────────────────────────────
async function loadKeywordRanking() {
  const period = document.getElementById('periodSelect').value;
  const topN   = parseInt(document.getElementById('topNSelect').value || 20);

  document.getElementById('rankingLoading').style.display = 'block';
  document.getElementById('rankingArea').style.display    = 'none';
  document.getElementById('rankingEmpty').style.display   = 'none';

  try {
    const params = new URLSearchParams({ period });
    if (_currentDate) params.append('collected_date', _currentDate);
    const data = await request('GET', '/products/trending/keywords?' + params.toString());
    const kws  = (data.keywords || []).slice(0, topN);
    _lastKeywords = kws;

    if (!kws.length) {
      document.getElementById('rankingLoading').style.display = 'none';
      document.getElementById('rankingEmpty').style.display   = 'block';
      document.getElementById('totalKeywords').textContent    = '0';
      document.getElementById('totalProducts').textContent    = '0';
      if (_availDates.length === 0) {
        // 서버에서 최신 날짜를 추론 (API 응답의 첫 데이터 기준)
      }
      return;
    }

    // 수집일 추론 (서버 응답에 날짜 없으면 API로 최신일 조회)
    if (!_currentDate && kws.length) {
      try {
        const dateRes = await request('GET', '/products/trending/keywords?' + new URLSearchParams({ period }));
        // 날짜 표시는 footerStatus로 처리
      } catch(_) {}
    }

    document.getElementById('totalKeywords').textContent = kws.length;
    const totalProd = kws.reduce((s, k) => s + (k.product_count || 0), 0);
    document.getElementById('totalProducts').textContent = totalProd.toLocaleString();

    renderRanking(kws);
    renderPieChart(kws.slice(0, 8));
    document.getElementById('rankingLoading').style.display = 'none';
    document.getElementById('rankingArea').style.display    = 'grid';
    document.getElementById('footerStatus').textContent     = '마지막 수집: ' + (_currentDate || '—');

    // 날짜 목록이 없으면 현재 데이터 날짜 반영
    if (_availDates.length === 0 && _currentDate) {
      _availDates = [_currentDate];
      renderDateNav();
    }

  } catch(e) {
    document.getElementById('rankingLoading').style.display = 'none';
    document.getElementById('rankingEmpty').style.display   = 'block';
    document.getElementById('rankingEmpty').innerHTML       =
      '<div style="color:var(--accent-danger)">데이터 로드 실패: ' + escapeHtml(e.message || '알 수 없는 오류') + '</div>' +
      '<button class="btn btn-sm btn-ghost" style="margin-top:8px" onclick="loadKeywordRanking()">다시 시도</button>';
  }
}

function renderRanking(kws) {
  const maxCount = Math.max(...kws.map(k => k.product_count || 1));
  const area = document.getElementById('rankingArea');
  area.innerHTML = kws.map((kw, i) => {
    const rank = kw.keyword_rank || (i + 1);
    const pct  = Math.round(((kw.product_count || 0) / maxCount) * 100);
    const isTop = rank <= 3;
    const rankEmoji = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : String(rank);
    // 트렌드 (keyword_rank 값을 기반으로 추후 비교 가능하도록 준비)
    const trendHtml = `<span class="trend-same kw-rank-trend">—</span>`;
    return `<div class="kw-rank-item" onclick="filterProductsByKeyword('${escapeHtml(kw.keyword)}')">
      <div class="kw-rank-num ${isTop ? 'top3' : ''}">${rankEmoji}</div>
      ${trendHtml}
      <div class="kw-rank-name">${escapeHtml(kw.keyword)}</div>
      <div class="kw-rank-bar-wrap">
        <div class="kw-rank-bar" style="width:${pct}%"></div>
      </div>
    </div>`;
  }).join('');
}

function renderPieChart(kws) {
  const labels = kws.map(k => k.keyword);
  const vals   = kws.map(k => k.product_count || 1);
  document.getElementById('pieCenterNum').textContent = kws.length;

  const ctx = document.getElementById('pieChart').getContext('2d');
  if (_pieChart) _pieChart.destroy();
  _pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: vals,
        backgroundColor: CHART_COLORS.slice(0, kws.length),
        borderWidth: 0,
        hoverOffset: 4,
      }],
    },
    options: {
      cutout: '62%',
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw}개` },
      }},
      animation: { duration: 500 },
    },
  });

  const total = vals.reduce((s, v) => s + v, 0);
  document.getElementById('legendArea').innerHTML = kws.map((kw, i) => {
    const pct = total ? Math.round((kw.product_count || 0) / total * 100) : 0;
    return `<div style="display:flex;align-items:center;gap:5px;padding:1px 0">
      <span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${CHART_COLORS[i]};flex-shrink:0"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${escapeHtml(kw.keyword)}</span>
      <span style="color:var(--text-muted);flex-shrink:0">${pct}%</span>
    </div>`;
  }).join('');
}

// ── 인기상품 조회 ─────────────────────────────────────────────────────────
function filterProductsByKeyword(kw) {
  _selectedKw = kw;
  _prodOffset = 0;
  document.querySelectorAll('.kw-tab')[1].click();
  const btn = document.getElementById('prodFilterBtn');
  if (btn) btn.textContent = '필터: ' + kw;
  loadProducts();
}

async function loadProducts() {
  const period  = document.getElementById('prodPeriodSelect').value;
  const limit   = _prodLimit();
  const priceMin = parseInt(document.getElementById('priceMin').value || 0) || null;
  const priceMax = parseInt(document.getElementById('priceMax').value || 0) || null;
  const tbody   = document.getElementById('prodTbody');
  tbody.innerHTML = '<tr><td colspan="9" style="padding:20px;text-align:center;color:var(--text-muted)">불러오는 중...</td></tr>';

  try {
    const params = { period, limit, offset: _prodOffset };
    if (_selectedKw) params.keyword = _selectedKw;
    if (priceMin)   params.price_min = priceMin;
    if (priceMax)   params.price_max = priceMax;

    const data = await request('GET', '/products/trending?' + new URLSearchParams(params));
    const rows = data.products || data.items || (Array.isArray(data) ? data : []);
    const total = data.total || rows.length;

    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="9" style="padding:24px;text-align:center;color:var(--text-muted)">상품 데이터가 없습니다.</td></tr>';
      document.getElementById('prodPagination').innerHTML = '';
      return;
    }

    tbody.innerHTML = rows.map((p, i) => {
      const imgSrc = toProxyUrl(p.thumbnail_url || p.image_url || '');
      const imgEl  = imgSrc
        ? `<img src="${imgSrc}" class="product-thumb" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="product-thumb" style="display:flex;align-items:center;justify-content:center;font-size:18px">📦</div>`;
      const price  = p.lowest_price || p.price || 0;
      const coll   = (p.collected_date || p.created_at || '').slice(0, 10);
      const rank   = (_prodOffset + i + 1);
      return `<tr>
        <td style="text-align:center;font-weight:700;color:var(--text-muted)">${rank}</td>
        <td>${imgEl}</td>
        <td>
          <div style="font-weight:600;font-size:13px;line-height:1.4;margin-bottom:2px">
            ${p.product_url ? `<a href="${escapeHtml(p.product_url)}" target="_blank" rel="noopener" style="color:var(--text-primary)">${escapeHtml(p.product_name || '—')}</a>` : escapeHtml(p.product_name || '—')}
          </div>
          ${p.keyword ? `<span style="font-size:11px;background:var(--bg-elevated);padding:1px 5px;border-radius:3px;color:var(--text-secondary)">${escapeHtml(p.keyword)}</span>` : ''}
        </td>
        <td style="font-weight:700;color:var(--accent-primary)">${price ? price.toLocaleString() + '원' : '—'}</td>
        <td style="font-size:12px;color:var(--text-secondary)">${escapeHtml(p.mall_name || '—')}</td>
        <td style="font-size:12px">${escapeHtml(p.brand || '—')}</td>
        <td style="font-size:12px;color:var(--text-muted)">${escapeHtml((p.category1 || '') + (p.category2 ? ' > ' + p.category2 : ''))}</td>
        <td style="text-align:center;font-size:11px">${p.is_npay ? '<span style="background:#03cf5d;color:#fff;padding:1px 4px;border-radius:3px">N</span>' : '—'}</td>
        <td style="font-size:12px;color:var(--text-muted)">${coll}</td>
      </tr>`;
    }).join('');

    // 페이지네이션
    const totalPages = Math.ceil(total / limit);
    const curPage = Math.floor(_prodOffset / limit) + 1;
    document.getElementById('prodPagination').innerHTML = total > limit
      ? `<span>${total.toLocaleString()}개 중 ${_prodOffset + 1}–${Math.min(_prodOffset + limit, total)}</span>
         <div style="display:flex;gap:4px">
           <button class="btn btn-xs btn-ghost" ${curPage<=1?'disabled':''} onclick="changeProdPage(-1)">이전</button>
           <span>${curPage} / ${totalPages}</span>
           <button class="btn btn-xs btn-ghost" ${curPage>=totalPages?'disabled':''} onclick="changeProdPage(1)">다음</button>
         </div>`
      : `<span>${total.toLocaleString()}개</span>`;

  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="9" style="padding:20px;text-align:center;color:var(--accent-danger)">
      조회 실패: ${escapeHtml(e.message || '')}<br>
      <button class="btn btn-xs btn-ghost" style="margin-top:6px" onclick="loadProducts()">다시 시도</button>
    </td></tr>`;
  }
}

function changeProdPage(delta) {
  _prodOffset = Math.max(0, _prodOffset + delta * _prodLimit());
  loadProducts();
}

// ── DOMContentLoaded ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  if (typeof initCommonLayout === 'function') initCommonLayout();
  document.getElementById('prodFilterBtn').addEventListener('click', () => {
    _selectedKw = null;
    document.getElementById('prodFilterBtn').textContent = '전체 키워드';
    _prodOffset = 0;
    loadProducts();
  });
  await loadAvailDates();
  await loadKeywordRanking();
});
</script>
</body>
</html>
