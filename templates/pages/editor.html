{% load static %}
<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>상품 에디터 - ChannelP</title>
<link rel="stylesheet" href="/assets/css/common.css"><link rel="stylesheet" href="/assets/css/layout.css"><link rel="stylesheet" href="/assets/css/components.css"></head>
<body><div class="app-wrapper"><header class="app-header"><div class="header-left"><button class="sidebar-toggle-btn" id="sidebarToggle"><span></span><span></span><span></span></button><span class="header-logo">ChannelP</span></div><div class="header-right"><div class="header-user"><span id="headerUsername">-</span><button class="btn btn-sm btn-ghost" id="logoutBtn">로그아웃</button></div></div></header><nav class="app-sidebar" id="appSidebar"></nav><main class="app-main"><div class="page-header"><h1 class="page-title">상품 에디터</h1></div><div class="card"><div class="card-body"><div style="display:grid;grid-template-columns:repeat(2,minmax(200px,1fr));gap:8px;"><input class="form-input" id="kw" placeholder="키워드"><button class="btn btn-primary" id="searchBtn">오너클랜 조회</button><input class="form-input" id="wid" placeholder="wholesale_product_id"><input class="form-input" id="name" placeholder="편집 상품명"><input class="form-input" id="price" type="number" placeholder="판매가"><button class="btn btn-ghost" id="saveBtn">드래프트 저장</button></div><pre id="out" style="margin-top:12px;">대기 중...</pre></div></div></main></div>
<script src="/assets/js/sidebar.js"></script><script src="/assets/js/common.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script>async function search(){const k=document.getElementById('kw').value.trim();if(!k){alert('키워드 입력');return;}const data=await API.products.ownerclanPopular({keyword:k,limit:20}).catch(e=>({error:e.message}));document.getElementById('out').textContent=JSON.stringify(data,null,2);}async function save(){const body={wholesale_product_id:Number(document.getElementById('wid').value||0),edited_product_name:document.getElementById('name').value.trim(),target_sell_price:Number(document.getElementById('price').value||0),target_market:'smartstore'};const data=await API.products.editorV2CreateDraft(body).catch(e=>({error:e.message}));document.getElementById('out').textContent=JSON.stringify(data,null,2);}async function boot(){if(!getAccessToken()&&typeof refreshTokens==='function'){await refreshTokens();}if(!getAccessToken()){location.href='/login.html';return;}const me=await API.auth.me().catch(()=>null);if(!me){location.href='/login.html';return;}document.getElementById('headerUsername').textContent=me.username||'-';document.getElementById('logoutBtn').onclick=logout;document.getElementById('searchBtn').onclick=search;document.getElementById('saveBtn').onclick=save;}boot();</script>
</body></html>
