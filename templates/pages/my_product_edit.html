          <a class="btn btn-ghost btn-sm" id="marketLink" href="#" target="_blank" rel="noopener" style="display:none">留덉폆?먯꽌 ?닿린</a>
          <button class="btn btn-ghost btn-sm" id="cancelBtn">痍⑥냼</button>
          <button class="btn btn-primary btn-sm" id="saveBtn">???/button>

<script src="/assets/js/sidebar.js?v=20260406d"></script>
<script src="/assets/js/common.js?v=20260406d"></script>
<script src="/assets/js/api.js?v=20260406d"></script>
<script src="/assets/js/auth.js?v=20260406d"></script>
<script src="/assets/js/theme.js?v=20260406d"></script>
<script>
'use strict';

let currentProductId = null;

function getQueryProductId() {
  const params = new URLSearchParams(location.search);
  return params.get('id');
}

function backToList() {
  location.href = '/pages/my_products.html';
}

function fillForm(data) {
  document.getElementById('productName').value = data.product_name || '';
  document.getElementById('salePrice').value = data.sale_price ?? '';
  document.getElementById('originalPrice').value = data.original_price ?? '';
  document.getElementById('categoryName').value = data.category_name || '';
  document.getElementById('status').value = data.status || 'ON_SALE';
  document.getElementById('thumbnailUrl').value = data.thumbnail_url || '';
  document.getElementById('accountName').value = `${data.market_account_name || '-'} / ${data.market_platform || '-'}`;
  document.getElementById('marketProductId').value = data.market_product_id || '';
  document.getElementById('wholesaleProductId').value = data.wholesale_product_id || '';
  document.getElementById('marginRate').value = Number(data.price_margin_rate || 0).toFixed(1);
  const thumbUrl = data.thumbnail_url || '';
  const thumbSrc = thumbUrl.startsWith('http://') ? '/api/products/proxy-image?url=' + encodeURIComponent(thumbUrl) : thumbUrl;
  document.getElementById('thumbnailPreview').src = thumbSrc;
  document.getElementById('thumbnailPreview').style.display = thumbUrl ? 'block' : 'none';
  document.getElementById('saveMessage').textContent = '?섏젙 ????ν븯?몄슂.';

  const marketLink = document.getElementById('marketLink');
  if (data.market_platform === 'smartstore' && data.market_product_id) {
    marketLink.href = `https://smartstore.naver.com/main/products/${data.market_product_id}`;
    marketLink.style.display = 'inline-flex';
  } else {
    marketLink.style.display = 'none';
  }
}

async function loadProduct() {
  currentProductId = getQueryProductId();
  if (!currentProductId) {
    document.getElementById('saveMessage').textContent = '?섎せ???묎렐?낅땲??';
    return;
  }

  try {
    const data = await request('GET', `/my-products/${currentProductId}`);
    fillForm(data);
  } catch (e) {
    document.getElementById('saveMessage').textContent = `遺덈윭?ㅺ린 ?ㅽ뙣: ${e.message || e}`;
  }
}

async function saveProduct() {
  if (!currentProductId) return;

  const body = {
    product_name: document.getElementById('productName').value.trim(),
    sale_price: document.getElementById('salePrice').value,
    original_price: document.getElementById('originalPrice').value,
    category_name: document.getElementById('categoryName').value.trim(),
    status: document.getElementById('status').value,
    thumbnail_url: document.getElementById('thumbnailUrl').value.trim(),
    wholesale_product_id: document.getElementById('wholesaleProductId').value.trim(),
    price_margin_rate: parseFloat(document.getElementById('marginRate').value || '0'),
  };

  try {
    await request('PATCH', `/my-products/${currentProductId}`, body);
    document.getElementById('saveMessage').textContent = '??λ릺?덉뒿?덈떎.';
    showToast('?곹뭹 ?섏젙????λ릺?덉뒿?덈떎.');
    await loadProduct();
  } catch (e) {
    document.getElementById('saveMessage').textContent = `????ㅽ뙣: ${e.message || e}`;
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!getAccessToken() && typeof refreshTokens === 'function') await refreshTokens();
  if (!getAccessToken()) {
    location.href = '/login.html';
    return;
  }
  document.getElementById('backBtn').addEventListener('click', backToList);
  document.getElementById('cancelBtn').addEventListener('click', backToList);
  document.getElementById('saveBtn').addEventListener('click', saveProduct);
  document.getElementById('thumbnailUrl').addEventListener('input', (e) => {
    document.getElementById('thumbnailPreview').src = e.target.value.trim();
  });
  loadProduct();
});
</script>
</body>
</html>
